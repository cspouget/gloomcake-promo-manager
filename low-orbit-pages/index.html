<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Low Orbit — GloomCake</title>
  <meta name="description" content="Listen to Low Orbit by GloomCake on Spotify, Apple Music, YouTube Music, SoundCloud, Amazon Music and more." />
  <meta property="og:title" content="Low Orbit — GloomCake" />
  <meta property="og:description" content="Choose your platform and listen to Low Orbit by GloomCake." />
  <meta property="og:type" content="music.album" />
  <meta property="og:image" content="https://d2ol7oe51mr4n9.cloudfront.net/user_3JM64mVrQ1AIikIoUSvFNpK62Ie/241e9858-0909-4021-a681-e52ab7b61ef5.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#07090b" />
  <style>
    :root{--bg:#07090b;--ink:#f3f4f5;--muted:#9aa2a8;--line:rgba(255,255,255,.14);--glass:rgba(9,12,15,.58)}
    *{box-sizing:border-box}
    html{background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
    body{margin:0;min-height:100vh;background:
      linear-gradient(rgba(7,9,11,.64),rgba(7,9,11,.95)),
      url("https://d2ol7oe51mr4n9.cloudfront.net/user_3JM64mVrQ1AIikIoUSvFNpK62Ie/241e9858-0909-4021-a681-e52ab7b61ef5.png") center 38%/cover fixed no-repeat}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 15%,rgba(255,255,255,.04),transparent 32rem)}
    main{width:min(1120px,calc(100% - 28px));margin:auto;padding:28px 0 50px}
    .hero{min-height:72vh;display:grid;grid-template-columns:minmax(280px,560px) 1fr;gap:clamp(32px,8vw,110px);align-items:end;padding:6vh 0 8vh}
    .cover-wrap{position:relative}
    .cover-wrap:after{content:"";position:absolute;inset:8% -6% -8% 8%;z-index:-1;background:rgba(180,195,205,.08);filter:blur(42px);border-radius:50%}
    .cover{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border:1px solid rgba(255,255,255,.18);box-shadow:0 42px 110px rgba(0,0,0,.48)}
    .copy{padding-bottom:10px}
    .eyebrow{margin:0 0 18px;color:#c5ced4;font:700 12px/1.3 "Courier New",monospace;letter-spacing:.28em}
    h1{margin:0;font-size:clamp(58px,9vw,128px);line-height:.83;letter-spacing:-.065em;font-weight:600}
    .sub{max-width:520px;margin:26px 0 0;color:var(--muted);font-size:clamp(17px,2vw,22px);line-height:1.55}
    .share-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
    button,.text-link{min-height:48px}
    button{border:1px solid rgba(255,255,255,.2);border-radius:999px;background:rgba(255,255,255,.08);color:var(--ink);padding:0 20px;font:600 15px/1 Arial;cursor:pointer;backdrop-filter:blur(18px)}
    button:hover{background:rgba(255,255,255,.13)}
    .status{display:inline-flex;align-items:center;color:var(--muted);font-size:14px}
    .platforms{border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
    .platform{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:108px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);transition:.18s ease;padding:18px 0}
    .platform:nth-child(odd){padding-right:28px;border-right:1px solid var(--line)}
    .platform:nth-child(even){padding-left:28px}
    .platform:hover{background:rgba(255,255,255,.035);padding-left:18px;padding-right:18px}
    .platform strong{display:block;font-size:clamp(22px,3vw,34px);font-weight:500;letter-spacing:-.03em}
    .platform small{display:block;margin-top:6px;color:var(--muted);font-size:13px}
    .arrow{font-size:24px;color:#c5ced4}
    .social{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:26px 0 0;color:var(--muted)}
    .social p{margin:0;font:700 11px/1.3 "Courier New",monospace;letter-spacing:.22em;text-transform:uppercase}
    .social nav{display:flex;gap:20px;flex-wrap:wrap}
    .social a{color:var(--muted);text-decoration:none}
    .social a:hover{color:var(--ink)}
    footer{display:flex;justify-content:space-between;gap:20px;margin-top:40px;padding-top:24px;border-top:1px solid var(--line);color:#7f878d;font:700 10px/1.2 "Courier New",monospace;letter-spacing:.2em}
    a:focus-visible,button:focus-visible{outline:2px solid #e8edf0;outline-offset:4px}
    @media(max-width:760px){
      body{background-attachment:scroll}
      main{width:min(100% - 22px,620px);padding-top:12px}
      .hero{min-height:auto;grid-template-columns:1fr;gap:28px;padding:20px 0 48px}
      .copy{padding:0}
      h1{font-size:clamp(56px,19vw,92px)}
      .platforms{grid-template-columns:1fr}
      .platform:nth-child(odd),.platform:nth-child(even){padding:18px 0;border-right:0}
      .platform:hover{padding-left:10px;padding-right:10px}
      .social{align-items:flex-start;flex-direction:column}
    }
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
<main>
  <section class="hero">
    <div class="cover-wrap">
      <img class="cover" src="https://d2ol7oe51mr4n9.cloudfront.net/user_3JM64mVrQ1AIikIoUSvFNpK62Ie/241e9858-0909-4021-a681-e52ab7b61ef5.png" alt="Low Orbit album cover by GloomCake" />
    </div>
    <div class="copy">
      <p class="eyebrow">GLOOMCAKE · NEW ALBUM</p>
      <h1>LOW<br>ORBIT</h1>
      <p class="sub">Choose where you listen.</p>
      <div class="share-row">
        <button id="share" type="button">Share Low Orbit</button>
        <button id="copy" type="button">Copy Link</button>
        <span class="status" id="status" aria-live="polite"></span>
      </div>
    </div>
  </section>

  <section class="platforms" aria-label="Listen to Low Orbit">
    <a class="platform" href="https://open.spotify.com/search/GloomCake%20Low%20Orbit" target="_blank" rel="noreferrer"><span><strong>Spotify</strong><small>Find Low Orbit</small></span><span class="arrow">↗</span></a>
    <a class="platform" href="https://music.apple.com/us/search?term=GloomCake%20Low%20Orbit" target="_blank" rel="noreferrer"><span><strong>Apple Music</strong><small>Find Low Orbit</small></span><span class="arrow">↗</span></a>
    <a class="platform" href="https://music.youtube.com/search?q=GloomCake%20Low%20Orbit" target="_blank" rel="noreferrer"><span><strong>YouTube Music</strong><small>Find Low Orbit</small></span><span class="arrow">↗</span></a>
    <a class="platform" href="https://soundcloud.com/gloomcakeofficial" target="_blank" rel="noreferrer"><span><strong>SoundCloud</strong><small>GloomCake</small></span><span class="arrow">↗</span></a>
    <a class="platform" href="https://music.amazon.com/search/GloomCake%20Low%20Orbit" target="_blank" rel="noreferrer"><span><strong>Amazon Music</strong><small>Find Low Orbit</small></span><span class="arrow">↗</span></a>
    <a class="platform" href="https://www.youtube.com/results?search_query=GloomCake+Low+Orbit" target="_blank" rel="noreferrer"><span><strong>YouTube</strong><small>Search GloomCake Low Orbit</small></span><span class="arrow">↗</span></a>
  </section>

  <section class="social">
    <p>GloomCake elsewhere</p>
    <nav aria-label="GloomCake social links">
      <a href="https://www.tiktok.com/search?q=GloomCake%20Low%20Orbit" target="_blank" rel="noreferrer">TikTok</a>
      <a href="https://www.youtube.com/results?search_query=GloomCake" target="_blank" rel="noreferrer">YouTube</a>
      <a href="https://www.instagram.com/officialgloomcake/" target="_blank" rel="noreferrer">Instagram</a>
    </nav>
  </section>

  <footer><span>GLOOMCAKE</span><span>LOW ORBIT</span></footer>
</main>
<script>
const share=document.getElementById('share');
const copy=document.getElementById('copy');
const status=document.getElementById('status');
async function copyLink(){
  await navigator.clipboard.writeText(location.href);
  status.textContent='Copied';
  setTimeout(()=>status.textContent='',1600);
}
share.addEventListener('click',async()=>{
  if(navigator.share){
    try{await navigator.share({title:'Low Orbit by GloomCake',text:'Listen to Low Orbit by GloomCake.',url:location.href});return}catch(e){if(e.name==='AbortError')return}
  }
  copyLink();
});
copy.addEventListener('click',copyLink);
</script>
</body>
</html>
